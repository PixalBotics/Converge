# Next.js on Netlify must use the OpenNext adapter (this plugin), not “static file” hosting.
# If Site settings → Build & deploy → Publish directory is set to the repo root, deep links
# and refreshes return 404. This file overrides that: publish points at the Next build output
# and the plugin provisions Functions/Edge so App Router routes are served correctly.

[build]
  # Netlify: no clean:next (fresh clone + cache); duplicate-import + env checks before build.
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  NODE_OPTIONS = "--max-old-space-size=8192"
  # Required in Netlify UI → Environment variables:
  # NEXT_PUBLIC_API_BASE_URL
  # Recommended: NEXT_PUBLIC_CHAT_SOCKET_BASE_URL, NEXT_PUBLIC_CHAT_SOCKET_NAMESPACE

[[plugins]]
  package = "@netlify/plugin-nextjs"
